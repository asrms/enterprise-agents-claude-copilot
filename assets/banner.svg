<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Enterprise Claude Agents</title>
  <desc id="desc">46 specialized AI agents and 304 skills covering the whole software development lifecycle, for Claude Code and GitHub Copilot.</desc>
  <style>
    .pulse{opacity:0}
    .glow{animation:breathe 8s ease-in-out infinite}
    .glow.b{animation-delay:-4s}
    .orbit{animation:flow 30s linear infinite}
    .ripple{transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 4s ease-out infinite}
    .ripple.r2{animation-delay:2s}
    .star{fill:#FFFFFF;opacity:.15;animation:twinkle 5s ease-in-out infinite}
    .underline{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
    @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-240}}
    @keyframes ripple{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
    @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes glow{0%{fill:#1B1F45;stroke-width:1}6%{fill:#2C3170;stroke-width:2.5}25%,100%{fill:#1B1F45;stroke-width:1}}
    @keyframes t0{0%{transform:translate(0.0px,-56.0px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(0.0px,-122.0px);opacity:0}100%{transform:translate(0.0px,-122.0px);opacity:0}}
    .p0{animation:t0 4.0s linear 0.00s infinite}
    .n0{animation:glow 4.0s ease-out 1.15s infinite}
    @keyframes t1{0%{transform:translate(41.4px,-37.7px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(96.0px,-87.3px);opacity:0}100%{transform:translate(96.0px,-87.3px);opacity:0}}
    .p1{animation:t1 4.0s linear 0.50s infinite}
    .n1{animation:glow 4.0s ease-out 1.65s infinite}
    @keyframes t2{0%{transform:translate(56.0px,-0.0px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(137.0px,0.0px);opacity:0}100%{transform:translate(137.0px,0.0px);opacity:0}}
    .p2{animation:t2 4.0s linear 1.00s infinite}
    .n2{animation:glow 4.0s ease-out 2.15s infinite}
    @keyframes t3{0%{transform:translate(41.4px,37.7px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(96.0px,87.3px);opacity:0}100%{transform:translate(96.0px,87.3px);opacity:0}}
    .p3{animation:t3 4.0s linear 1.50s infinite}
    .n3{animation:glow 4.0s ease-out 2.65s infinite}
    @keyframes t4{0%{transform:translate(0.0px,56.0px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(0.0px,122.0px);opacity:0}100%{transform:translate(0.0px,122.0px);opacity:0}}
    .p4{animation:t4 4.0s linear 2.00s infinite}
    .n4{animation:glow 4.0s ease-out 3.15s infinite}
    @keyframes t5{0%{transform:translate(-41.4px,37.7px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(-96.0px,87.3px);opacity:0}100%{transform:translate(-96.0px,87.3px);opacity:0}}
    .p5{animation:t5 4.0s linear 2.50s infinite}
    .n5{animation:glow 4.0s ease-out 3.65s infinite}
    @keyframes t6{0%{transform:translate(-56.0px,0.0px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(-137.0px,0.0px);opacity:0}100%{transform:translate(-137.0px,0.0px);opacity:0}}
    .p6{animation:t6 4.0s linear 3.00s infinite}
    .n6{animation:glow 4.0s ease-out 4.15s infinite}
    @keyframes t7{0%{transform:translate(-41.4px,-37.7px);opacity:0}4%{opacity:1}26%{opacity:1}30%{transform:translate(-96.0px,-87.3px);opacity:0}100%{transform:translate(-96.0px,-87.3px);opacity:0}}
    .p7{animation:t7 4.0s linear 3.50s infinite}
    .n7{animation:glow 4.0s ease-out 4.65s infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.pulse,.ripple{opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="0.55" stop-color="#141433"/>
      <stop offset="1" stop-color="#231544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0875F"/>
      <stop offset="0.5" stop-color="#C86DD7"/>
      <stop offset="1" stop-color="#6E8BFF"/>
    </linearGradient>
    <linearGradient id="spoke" gradientUnits="userSpaceOnUse" x1="-165" y1="-150" x2="165" y2="150">
      <stop offset="0" stop-color="#F0875F"/>
      <stop offset="0.5" stop-color="#C86DD7"/>
      <stop offset="1" stop-color="#6E8BFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0875F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F0875F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="420" fill="url(#fadeRight)"/></mask>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="glow" cx="930" cy="120" r="260" fill="url(#glowA)"/>
  <circle class="glow b" cx="1120" cy="330" r="240" fill="url(#glowB)"/>
  <g>
    <circle class="star" cx="760" cy="60" r="1.6" style="animation-delay:0s"/>
    <circle class="star" cx="880" cy="380" r="1.6" style="animation-delay:1.3s"/>
    <circle class="star" cx="1230" cy="60" r="1.6" style="animation-delay:2.1s"/>
    <circle class="star" cx="1240" cy="250" r="1.6" style="animation-delay:0.7s"/>
    <circle class="star" cx="700" cy="390" r="1.6" style="animation-delay:2.8s"/>
    <circle class="star" cx="1160" cy="395" r="1.6" style="animation-delay:1.9s"/>
    <circle class="star" cx="820" cy="30" r="1.6" style="animation-delay:3.4s"/>
  </g>

  <!-- Left: text -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#F0875F" font-size="18" font-weight="600" letter-spacing="3">AGENT LIBRARY FOR THE FULL SDLC</text>
    <text x="72" y="170" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Enterprise</text>
    <text x="72" y="232" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Claude Agents</text>
    <rect class="underline" x="74" y="254" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="298" fill="#C9CCE6" font-size="22">Expert AI teammates, from requirements to production.</text>

    <!-- Stat chips -->
    <g font-size="17" font-weight="600">
      <rect x="72" y="326" width="146" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#F0875F" stroke-opacity="0.7"/>
      <text x="145" y="353" fill="#FFFFFF" text-anchor="middle">46 agents</text>
      <rect x="232" y="326" width="146" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#C86DD7" stroke-opacity="0.7"/>
      <text x="305" y="353" fill="#FFFFFF" text-anchor="middle">304 skills</text>
      <rect x="392" y="326" width="264" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#6E8BFF" stroke-opacity="0.7"/>
      <text x="524" y="353" fill="#FFFFFF" text-anchor="middle">Claude Code + Copilot</text>
    </g>
  </g>

  <!-- Right: agent network (the eight agent groups) -->
  <g transform="translate(1000 210)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <ellipse class="orbit" rx="165" ry="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="4 8"/>
    <circle r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <g stroke="url(#spoke)" stroke-width="2" stroke-opacity="0.45">
      <line x1="0.0" y1="-56.0" x2="0.0" y2="-150.0"/>
      <line x1="41.4" y1="-37.7" x2="116.7" y2="-106.1"/>
      <line x1="56.0" y1="-0.0" x2="165.0" y2="-0.0"/>
      <line x1="41.4" y1="37.7" x2="116.7" y2="106.1"/>
      <line x1="0.0" y1="56.0" x2="0.0" y2="150.0"/>
      <line x1="-41.4" y1="37.7" x2="-116.7" y2="106.1"/>
      <line x1="-56.0" y1="0.0" x2="-165.0" y2="0.0"/>
      <line x1="-41.4" y1="-37.7" x2="-116.7" y2="-106.1"/>
    </g>
    <g>
      <circle class="pulse p0" r="3.5" fill="#F0875F"/>
      <circle class="pulse p1" r="3.5" fill="#E97C86"/>
      <circle class="pulse p2" r="3.5" fill="#DA75AE"/>
      <circle class="pulse p3" r="3.5" fill="#C86DD7"/>
      <circle class="pulse p4" r="3.5" fill="#A874E6"/>
      <circle class="pulse p5" r="3.5" fill="#8A80F5"/>
      <circle class="pulse p6" r="3.5" fill="#6E8BFF"/>
      <circle class="pulse p7" r="3.5" fill="#5FB3F0"/>
    </g>

    <circle class="ripple" r="54" fill="none" stroke="#C86DD7" stroke-width="2"/>
    <circle class="ripple r2" r="54" fill="none" stroke="#F0875F" stroke-width="2"/>
    <circle r="54" fill="#0F1330" stroke="url(#accent)" stroke-width="3"/>
    <text y="-4" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">46</text>
    <text y="18" fill="#C9CCE6" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">AGENTS</text>

    <g font-size="14" font-weight="600" text-anchor="middle">
      <g transform="translate(0.0 -150.0)">
        <rect class="pill n0" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#F0875F"/>
        <text y="5" fill="#FFFFFF">Plan</text>
      </g>
      <g transform="translate(116.7 -106.1)">
        <rect class="pill n1" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#E97C86"/>
        <text y="5" fill="#FFFFFF">Build</text>
      </g>
      <g transform="translate(165.0 -0.0)">
        <rect class="pill n2" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#DA75AE"/>
        <text y="5" fill="#FFFFFF">Data &amp; AI</text>
      </g>
      <g transform="translate(116.7 106.1)">
        <rect class="pill n3" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#C86DD7"/>
        <text y="5" fill="#FFFFFF">Quality</text>
      </g>
      <g transform="translate(0.0 150.0)">
        <rect class="pill n4" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#A874E6"/>
        <text y="5" fill="#FFFFFF">Security</text>
      </g>
      <g transform="translate(-116.7 106.1)">
        <rect class="pill n5" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#8A80F5"/>
        <text y="5" fill="#FFFFFF">Deliver</text>
      </g>
      <g transform="translate(-165.0 0.0)">
        <rect class="pill n6" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#6E8BFF"/>
        <text y="5" fill="#FFFFFF">Operate</text>
      </g>
      <g transform="translate(-116.7 -106.1)">
        <rect class="pill n7" x="-54" y="-18" width="108" height="36" rx="18" fill="#1B1F45" stroke="#5FB3F0"/>
        <text y="5" fill="#FFFFFF">Cloud</text>
      </g>
    </g>
  </g>
</svg>
