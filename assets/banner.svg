<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Enterprise Claude Agents</title>
  <desc id="desc">46 specialized AI agents and 304 skills covering the whole software development lifecycle, for Claude Code and GitHub Copilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="0.55" stop-color="#141433"/>
      <stop offset="1" stop-color="#231544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0875F"/>
      <stop offset="0.5" stop-color="#C86DD7"/>
      <stop offset="1" stop-color="#6E8BFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0875F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F0875F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="420" fill="url(#fadeRight)"/></mask>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="930" cy="120" r="260" fill="url(#glowA)"/>
  <circle cx="1120" cy="330" r="240" fill="url(#glowB)"/>

  <!-- Left: text -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#F0875F" font-size="18" font-weight="600" letter-spacing="3">AGENT LIBRARY FOR THE FULL SDLC</text>
    <text x="72" y="170" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Enterprise</text>
    <text x="72" y="232" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Claude Agents</text>
    <rect x="74" y="254" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="298" fill="#C9CCE6" font-size="22">Expert AI teammates, from requirements to production.</text>

    <!-- Stat chips -->
    <g font-size="17" font-weight="600">
      <rect x="72" y="326" width="146" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#F0875F" stroke-opacity="0.7"/>
      <text x="145" y="353" fill="#FFFFFF" text-anchor="middle">46 agents</text>
      <rect x="232" y="326" width="146" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#C86DD7" stroke-opacity="0.7"/>
      <text x="305" y="353" fill="#FFFFFF" text-anchor="middle">304 skills</text>
      <rect x="392" y="326" width="264" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#6E8BFF" stroke-opacity="0.7"/>
      <text x="524" y="353" fill="#FFFFFF" text-anchor="middle">Claude Code + Copilot</text>
    </g>
  </g>

  <!-- Right: agent network -->
  <g transform="translate(1000 210)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- orbit rings -->
    <circle r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-dasharray="4 8"/>
    <circle r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- spokes -->
    <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="130" y2="-75"/>
      <line x1="0" y1="0" x2="130" y2="75"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-130" y2="75"/>
      <line x1="0" y1="0" x2="-130" y2="-75"/>
    </g>

    <!-- hub -->
    <circle r="54" fill="#0F1330" stroke="url(#accent)" stroke-width="3"/>
    <text y="-4" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">46</text>
    <text y="18" fill="#C9CCE6" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">AGENTS</text>

    <!-- phase nodes -->
    <g font-size="14" font-weight="600" text-anchor="middle">
      <g transform="translate(0 -150)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#F0875F"/>
        <text y="5" fill="#FFFFFF">Plan</text>
      </g>
      <g transform="translate(130 -75)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#E07A9A"/>
        <text y="5" fill="#FFFFFF">Build</text>
      </g>
      <g transform="translate(130 75)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#C86DD7"/>
        <text y="5" fill="#FFFFFF">Test</text>
      </g>
      <g transform="translate(0 150)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#9A7BF0"/>
        <text y="5" fill="#FFFFFF">Secure</text>
      </g>
      <g transform="translate(-130 75)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#6E8BFF"/>
        <text y="5" fill="#FFFFFF">Ship</text>
      </g>
      <g transform="translate(-130 -75)">
        <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#1B1F45" stroke="#5FB3F0"/>
        <text y="5" fill="#FFFFFF">Operate</text>
      </g>
    </g>

    <!-- small satellite dots -->
    <g fill="#FFFFFF" fill-opacity="0.55">
      <circle cx="75" cy="-130" r="3"/>
      <circle cx="150" cy="0" r="3"/>
      <circle cx="75" cy="130" r="3"/>
      <circle cx="-75" cy="130" r="3"/>
      <circle cx="-150" cy="0" r="3"/>
      <circle cx="-75" cy="-130" r="3"/>
    </g>
  </g>
</svg>
